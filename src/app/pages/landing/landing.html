<app-navbar></app-navbar>
@if (showOrderModal()) {
<app-order-modal></app-order-modal>
}

<main class="landing-main" style="overflow-x: hidden;">
  <!-- 1. HERO + TRUST BAR -->
  <app-hero></app-hero>

  <!-- 2. POPULAR DESIGNS / تصاميمنا الأكثر طلباً (Visual designs gallery directly after Hero) -->
  <div id="gallery" appScrollReveal revealDirection="right">
    <app-portfolio-slider [invitations]="invitations()" [categories]="categories()"></app-portfolio-slider>
  </div>

  <!-- 3. FREE DEMO BANNER / Lead Magnet (جرّب دعوتك مجانًا) -->
  <div id="demo" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-demo-form></app-demo-form>
  </div>

  <!-- 4. CUSTOMER FUNNEL JOURNEY / مسار الرحلة الـ 6 خطوات -->
  <div appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-journey-visualizer></app-journey-visualizer>
  </div>

  <!-- 5. EVENT TYPES / مناسبتك أيًا كانت... -->
  <div appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-platform-modules></app-platform-modules>
  </div>

  <!-- 6. HOW IT WORKS / كيف يعمل النظام؟ -->
  <div id="how-it-works" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-how-it-works></app-how-it-works>
  </div>

  <!-- 7. WHY SPECIAL CARDS / ليش تختار Special Cards؟ -->
  <div id="why" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-why-choose-us></app-why-choose-us>
  </div>

  <!-- 8. GUEST EXPERIENCE / تجربة الضيف -->
  <div appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-smart-system></app-smart-system>
  </div>

  <!-- 9. PRICING PACKAGES / باقات تناسب احتياجاتك -->
  <div id="packages" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-pricing></app-pricing>
  </div>

  <!-- ORDER REQUEST / طلب دعوة خاصة أو مخصصة -->
  <div id="order" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-order-request></app-order-request>
  </div>

  <!-- 10. APP SHOWCASE / كل شيء تحت تحكمك من جوالك -->
  <div id="app" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-app-showcase></app-app-showcase>
  </div>

  <!-- 11. REVIEWS / آراء العملاء -->
  <div id="reviews" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-testimonials></app-testimonials>
  </div>

  <!-- 12. RIYADH FOCUS / تركيزنا الرياض -->
  <div appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-why-riyadh></app-why-riyadh>
  </div>

  <!-- 13. SECURITY & PRIVACY / بيانات ضيوفك بأمان -->
  <div appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-privacy-section></app-privacy-section>
  </div>

  <!-- 14. FINAL CTA / خلّك Special... وخلّ دعوتك تتكلم عنك -->
  <div appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-final-cta></app-final-cta>
  </div>

  <!-- 15. CONTACT / تواصل معنا -->
  <div id="contact" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-contact></app-contact>
  </div>

  <!-- 16. BLOG / المدونة -->
  <div appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-blog [blogPosts]="blogPosts()"></app-blog>
  </div>

  <!-- 17. FAQ / الأسئلة الشائعة -->
  <div id="faq" appScrollReveal revealDirection="right" [revealDelay]="50">
    <app-faq></app-faq>
  </div>
</main>

<app-footer></app-footer>
