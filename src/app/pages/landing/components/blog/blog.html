<section id="blog" class="blog-dark-section">
  <div class="container mx-auto px-5">

    <!-- Header row -->
    <div class="flex flex-col items-start gap-4 mb-14 text-start">
      <h2 class="blog-heading font-display" [innerHTML]="'blog.title' | transloco"></h2>
      <div class="gold-divider" style="width: 48px;"></div>
      <button class="flex items-center gap-2 font-black group" style="color: var(--gold);" (click)="navigateToBlog()">
        <lucide-icon [name]="readMoreIcon()" class="w-5 h-5 transition-transform group-hover:-translate-x-1"></lucide-icon>
        {{ 'blog.viewAll' | transloco }}
      </button>
    </div>

    <!-- Blog Posts Grid -->
    <div class="grid md:grid-cols-3 gap-6">
      @for (post of displayedPosts(); track post.id) {
        <article class="blog-card group cursor-pointer" (click)="navigateToPost(post.id)">

          <!-- Image -->
          <div class="blog-img-wrap">
            <img [src]="post.imageUrl" [alt]="post.title"
                 class="blog-img group-hover:scale-105 transition-transform duration-700">
            <div class="blog-img-gradient"></div>

            <!-- Category badge (backend content) -->
            <div class="blog-cat-badge" dir="rtl">{{ post.category || ('blogPostDetail.defaultCategory' | transloco) }}</div>
          </div>

          <!-- Content -->
           <div class="blog-content space-y-3 text-start">
             <p class="text-sm font-bold" style="color: var(--gold);">{{ post.date | date:'yyyy/MM/dd' }}</p>
             <h4 class="blog-title group-hover:text-gold transition-colors" dir="rtl">{{ post.title }}</h4>
             <p class="text-sm leading-relaxed line-clamp-2 blog-excerpt" dir="rtl">{{ post.excerpt }}</p>
             <span class="blog-read-more">
               {{ 'blog.readMore' | transloco }}
               <lucide-icon [name]="readMoreIcon()" class="w-4 h-4"></lucide-icon>
             </span>
           </div>
        </article>
      }
    </div>

  </div>
</section>
