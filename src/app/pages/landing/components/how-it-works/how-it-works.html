<section id="how-it-works" class="how-it-works-section">
  <div class="how-header text-center mb-10">
    <h2 class="how-title font-display">{{ 'howItWorks.titlePlain' | transloco }}</h2>
    <p class="text-neutral-300 text-sm md:text-base mt-2">{{ 'howItWorks.subtitle' | transloco }}</p>
  </div>

  <div class="how-grid">
    <div class="how-connector" aria-hidden="true"></div>
    @for (i of steps; track i) {
      <div class="how-step">
        <div class="how-badge font-display">{{ '0' + (i + 1) }}</div>
        <h3 class="how-step-title">{{ 'howItWorks.step' + i + '.title' | transloco }}</h3>
        <p class="how-step-body">{{ 'howItWorks.step' + i + '.body' | transloco }}</p>
      </div>
    }
  </div>

  <div class="summary-bar mt-12 text-center">
    <div class="inline-flex items-center gap-3 px-6 py-3 rounded-full bg-gold-400/10 border border-gold-400/30 text-gold-400 text-sm font-bold">
      {{ 'howItWorks.summary' | transloco }}
    </div>
  </div>
</section>
