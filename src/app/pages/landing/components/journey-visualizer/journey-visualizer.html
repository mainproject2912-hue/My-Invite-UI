<section id="journey-visualizer" class="journey-section py-16 md:py-24 bg-gradient-to-b from-[#FAF8F5] via-[#F6F3ED] to-[#FAF8F5] border-y border-amber-900/10 relative overflow-hidden" dir="rtl">
  <!-- Ambient decorative glow -->
  <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-amber-500/5 blur-3xl rounded-full pointer-events-none" aria-hidden="true"></div>

  <div class="container mx-auto px-4 max-w-7xl relative z-10">
    <!-- Header -->
    <div class="text-center max-w-2xl mx-auto mb-12 md:mb-16">
      <span class="inline-flex items-center gap-1.5 px-4 py-1.5 text-xs font-bold text-amber-800 bg-amber-100/90 rounded-full border border-amber-300/80 mb-3.5 shadow-sm">
        <lucide-icon name="sparkles" class="w-3.5 h-3.5 text-amber-600"></lucide-icon>
        {{ 'journey.kicker' | transloco }}
      </span>
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-slate-900 mb-3 font-display tracking-tight leading-snug">
        {{ 'journey.title' | transloco }}
      </h2>
      <p class="text-slate-600 text-sm md:text-base font-medium leading-relaxed">
        {{ 'journey.subtitle' | transloco }}
      </p>
    </div>

    <!-- 6 Step Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 md:gap-5 lg:gap-6">
      @for (step of steps; track step.num) {
        <div class="journey-card group relative bg-white border border-slate-200/90 rounded-2xl p-5 md:p-6 transition-all duration-300 hover:-translate-y-1.5 hover:border-amber-400 hover:shadow-xl hover:shadow-amber-500/10 flex flex-col justify-between">
          <!-- Top Accent Line -->
          <div class="absolute top-0 inset-x-6 h-0.5 bg-gradient-to-r from-transparent via-amber-400 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-t-2xl"></div>

          <div>
            <!-- Step Badge & Icon Header -->
            <div class="flex items-center justify-between mb-4">
              <span class="step-num-badge inline-block px-2.5 py-1 text-xs font-bold text-amber-700 bg-amber-50 rounded-lg border border-amber-200/80 font-mono group-hover:bg-amber-500 group-hover:text-white group-hover:border-amber-500 transition-colors">
                {{ step.num }}
              </span>

              <div class="w-11 h-11 rounded-xl bg-amber-500/10 text-amber-700 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-white group-hover:scale-110 transition-all duration-300 shadow-sm">
                <lucide-icon [name]="step.icon" class="w-5 h-5"></lucide-icon>
              </div>
            </div>

            <!-- Title -->
            <h3 class="text-base font-bold text-slate-900 mb-2 font-display group-hover:text-amber-900 transition-colors">
              {{ step.titleKey | transloco }}
            </h3>

            <!-- Description -->
            <p class="text-xs text-slate-600 font-normal leading-relaxed">
              {{ step.descKey | transloco }}
            </p>
          </div>

          <!-- Bottom Step Flow Tag -->
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-amber-700/70 font-medium">
            <span>الخطوة {{ step.num }}</span>
            <lucide-icon name="arrow-left" class="w-3.5 h-3.5 opacity-60 group-hover:-translate-x-1 group-hover:opacity-100 transition-all"></lucide-icon>
          </div>
        </div>
      }
    </div>
  </div>
</section>
