<section id="faq" class="faq-section section-py">
  <div class="faq-inner">
    <div class="faq-header">
      <span class="badge-pill">{{ 'faq.kicker' | transloco }}</span>
      <h2 class="section-title font-display">{{ 'faq.title' | transloco }}</h2>
      <p class="section-sub">{{ 'faq.subtitle' | transloco }}</p>
    </div>

    <div class="faq-grid">
      @for (i of visibleIndices(); track i) {
        <div class="faq-item" [class.open]="isOpen(i)">
          <button
            type="button"
            class="faq-question"
            (click)="toggle(i)"
            [attr.aria-expanded]="isOpen(i)"
          >
            <span>{{ 'faq.q' + i + '.q' | transloco }}</span>
            <span class="faq-icon" aria-hidden="true">
              <lucide-icon [name]="isOpen(i) ? 'minus' : 'plus'"></lucide-icon>
            </span>
          </button>
          @if (isOpen(i)) {
            <div class="faq-answer">
              <p>{{ 'faq.q' + i + '.a' | transloco }}</p>
            </div>
          }
        </div>
      }
    </div>

    @if (indices.length > initialCount) {
      <div class="faq-more">
        <button type="button" class="faq-more-btn" (click)="toggleShowAll()">
          {{ (showAll() ? 'faq.showLess' : 'faq.showAll') | transloco }}
        </button>
      </div>
    }
  </div>
</section>
